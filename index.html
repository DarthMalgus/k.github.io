<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amantes de la Cocina Cercanas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff8e1;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            color: #d35400;
        }
        .profile {
            display: inline-block;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin: 10px;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mujeres apasionadas por la cocina a 5 km</h1>
        <p>Conoce personas que comparten tu amor por la gastronomía.</p>

        <div class="profile">
            <img src="chef1.jpg" alt="Chef">
            <h2>María</h2>
            <p>Especialista en pastelería.</p>
            <button>Ver perfil</button>
        </div>

        <div class="profile">
            <img src="chef2.jpg" alt="Chef">
            <h2>Laura</h2>
            <p>Amante de la comida italiana.</p>
            <button>Ver perfil</button>
        </div>

        <div class="profile">
            <img src="chef3.jpg" alt="Chef">
            <h2>Andrea</h2>
            <p>Maestra en cocina mexicana.</p>
            <button>Ver perfil</button>
        </div>

    </div>

</body>
</html>
